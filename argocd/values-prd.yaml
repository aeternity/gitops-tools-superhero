encValues:
  dex.github.clientID: ""
  dex.github.clientSecret: ""
  server.secretkey: ""

encAelabs:
  password: ""
  url: ""
  username: ""

argo-cd:
  global:
    domain: argocd.prd.service.aepps.com
  server:
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      pathType: ImplementationSpecific
      hosts:
        - "argocd.prd.service.aepps.com"
      tls:
        - secretName: traefik-default-cert
          hosts:
            - argocd.prd.service.aepps.com

  configs:
    params:
      server.insecure: true
      applicationsetcontroller.policy: create-update
    cm:
      url: https://argocd.prd.service.aepps.com
      users.anonymous.enabled: "false"
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $dex.github.clientID
              clientSecret: $dex.github.clientSecret
              orgs:
                - name: aeternity
      # Argo CD's externally facing base URL (optional). Required when configuring SSO
      # url: https://argocd.example.com
      application.instanceLabelKey: argocd.argoproj.io/instance
      repositories: |
        - url: https://github.com/aeternity/gitops-tools-superhero.git
        - url: https://github.com/aeternity/gitops-apps-aelabs.git
        - type: helm
          url: https://argoproj.github.io/argo-helm
          name: argo
        - type: helm
          url: https://bitnami-labs.github.io/sealed-secrets
          name: sealed-secrets
        - type: helm
          url: https://helm.traefik.io/traefik
          name: traefik
        - type: helm
          url: https://fluent.github.io/helm-charts
          name: fluent
        - type: helm
          url: https://charts.jetstack.io
          name: cert-manager
        - type: helm
          url: https://zekker6.github.io/helm-charts/
          name: plausible
      resource.customizations: |
        networking.k8s.io/Ingress:
          health.lua: |
            hs = {}
            hs.status = "Healthy"
            return hs
        bitnami.com/SealedSecret:
          health.lua: |
            hs = {}
            if obj.status ~= nil and obj.status.conditions ~= nil then
              for _, c in ipairs(obj.status.conditions) do
                if c.type == "Synced" and c.status == "True" then
                  hs.status = "Healthy"
                  hs.message = c.message
                  return hs
                end
              end
            end
            hs.status = "Progressing"
            hs.message = "Waiting for SealedSecret to be unsealed"
            return hs
        admissionregistration.k8s.io/MutatingWebhookConfiguration:
          ignoreDifferences: |
            jsonPointers:
            - /webhooks/0/failurePolicy
        admissionregistration.k8s.io/ValidatingWebhookConfiguration:
          ignoreDifferences: |
            jsonPointers:
            - /webhooks/0/failurePolicy
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, aeternity:devops, role:admin
        
projects:
  - name: tools
    namespace: argocd 
    additionalLabels: {}
    additionalAnnotations: {}
    description: Tools used to run the environment
    sourceRepos:
      - 'https://github.com/aeternity/gitops-tools-superhero.git'
    destinations:
      - namespace: tools
        server: https://kubernetes.default.svc
      - namespace: argocd
        server: https://kubernetes.default.svc
      - namespace: sealed-secrets
        server: https://kubernetes.default.svc
      - namespace: traefik
        server: https://kubernetes.default.svc
      - namespace: kube-system
        server: https://kubernetes.default.svc
      - namespace: monitoring
        server: https://kubernetes.default.svc
      - namespace: logging
        server: https://kubernetes.default.svc
      - namespace: cert-manager
        server: https://kubernetes.default.svc
      - namespace: rabbitmq
        server: https://kubernetes.default.svc
      - namespace: redis
        server: https://kubernetes.default.svc
      - namespace: plausible
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: '*'
        kind: '*'
  - name: apps
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    description: Applications deployed on K8S
    sourceRepos:
      - 'https://github.com/aeternity/gitops-apps-aelabs.git'
    destinations:
      - namespace: apps
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: '*'
        kind: '*'

