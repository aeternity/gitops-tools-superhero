encValues:  
  api-key: ""

cert-manager-webhook-hetzner:
  groupName: acme.superk8.com

  certManager:
    namespace: cert-manager
    serviceAccountName: cert-manager

  image:
    repository: deyaeddin/cert-manager-webhook-hetzner
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  nameOverride: ""
  fullnameOverride: ""

  service:
    type: ClusterIP
    port: 443

  secretName:
    - hetzner-dns-secret

