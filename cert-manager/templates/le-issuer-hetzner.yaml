apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-hetzner
spec:
  acme:
    email: badinov@vmandco.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: le-hetzner-issuer-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.superk8.com
            solverName: hetzner
            config:
              secretName: hetzner-dns-secret
              zoneName: {{ .Values.hetznerZoneName | quote }}
              apiUrl: {{ .Values.hetznerApiUrl | default "https://dns.hetzner.com/api/v1" | quote }}
