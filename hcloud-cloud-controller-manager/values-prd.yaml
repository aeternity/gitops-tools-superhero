encValues:
  hcloudApiToken: ""
hcloud-cloud-controller-manager:
  args:
    allocate-node-cidrs: "true"
    cluster-cidr: 172.16.64.0/18
  env:
    HCLOUD_TOKEN:
      valueFrom:
        secretKeyRef:
          name: hcloud-cloud-controller-manager-secret
          key: hcloudApiToken
    HCLOUD_NETWORK:
      value: prd-4c2n-network
