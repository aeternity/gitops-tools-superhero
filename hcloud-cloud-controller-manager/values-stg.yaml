encValues:
  hcloudApiToken: ""
hcloud-cloud-controller-manager:
  args:
    allocate-node-cidrs: "true"
    cluster-cidr: 192.168.66.0/24
  env:
    HCLOUD_TOKEN:
      valueFrom:
        secretKeyRef:
          name: hcloud-cloud-controller-manager-secret
          key: hcloudApiToken
    HCLOUD_NETWORK:
      value: stg-52cr-network


