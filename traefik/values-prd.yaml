defaultCertificateDomains:
  - "*.prd.service.aepps.com"

traefik:
  instanceLabelOverride: traefik
  globalArguments: []
  additionalArguments:
    - "--entrypoints.web.http.redirections.entrypoint.to=:443"
    - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
  logs:
    general:
      level: DEBUG
    access:
      enabled: true
  serviceAccount:
    create: true
  ports:
    web:
      expose:
        default: true
      redirectTo: websecure
    websecure:
      tls:
        enabled: true
  tlsStore:
    default:
      defaultCertificate:
        secretName: traefik-default-cert
  service:
    enabled: true
    type: LoadBalancer
    annotations:
      load-balancer.hetzner.cloud/name: "traefik-lb"
      load-balancer.hetzner.cloud/location: "nbg1"
      load-balancer.hetzner.cloud/type: "lb11"
      load-balancer.hetzner.cloud/ipv6-disabled: "true"
      load-balancer.hetzner.cloud/protocol: "tcp"
      load-balancer.hetzner.cloud/health-check-protocol: "tcp"
      load-balancer.hetzner.cloud/health-check-port: "80"
      load-balancer.hetzner.cloud/health-check-interval: "10s"
      load-balancer.hetzner.cloud/health-check-timeout: "5s"
      load-balancer.hetzner.cloud/health-check-retries: "2"